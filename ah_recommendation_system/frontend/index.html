<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AH股每日推荐系统</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
	<style>
		:root {
			--bg0: #0b1220;
			--bg1: #0e1a2e;
			--card: rgba(255, 255, 255, 0.06);
			--card2: rgba(255, 255, 255, 0.08);
			--stroke: rgba(255, 255, 255, 0.12);
			--text: rgba(255, 255, 255, 0.92);
			--muted: rgba(255, 255, 255, 0.66);
			--muted2: rgba(255, 255, 255, 0.50);
			--accent: #33d6a6;
			--accent2: #3b82f6;
			--warn: #f59e0b;
			--bad: #ef4444;
		}

		html, body {
			height: 100%;
		}

		body {
			font-family: "IBM Plex Sans", ui-sans-serif, system-ui;
			background: radial-gradient(1000px 600px at 20% 0%, rgba(51, 214, 166, 0.12), transparent 60%),
				radial-gradient(1000px 600px at 80% 0%, rgba(59, 130, 246, 0.16), transparent 55%),
				linear-gradient(180deg, var(--bg0), var(--bg1));
			color: var(--text);
		}

		.mono {
			font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular;
		}

		.panel {
			background: var(--card);
			border: 1px solid var(--stroke);
			border-radius: 14px;
			backdrop-filter: blur(10px);
		}

		.panel:hover {
			background: var(--card2);
		}

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			padding: 10px 12px;
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.14);
			background: rgba(255, 255, 255, 0.06);
			color: var(--text);
			transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
		}

		.btn:hover {
			transform: translateY(-1px);
			background: rgba(255, 255, 255, 0.10);
			border-color: rgba(255, 255, 255, 0.22);
		}

		.btn-primary {
			border-color: rgba(51, 214, 166, 0.35);
			background: rgba(51, 214, 166, 0.14);
		}

		.btn-primary:hover {
			background: rgba(51, 214, 166, 0.18);
		}

		.btn-blue {
			border-color: rgba(59, 130, 246, 0.35);
			background: rgba(59, 130, 246, 0.14);
		}

		.badge {
			border: 1px solid rgba(255, 255, 255, 0.14);
			background: rgba(255, 255, 255, 0.06);
			border-radius: 999px;
			padding: 6px 10px;
			font-size: 12px;
			color: var(--muted);
		}

		.input {
			width: 100%;
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.16);
			background: rgba(15, 23, 42, 0.55);
			color: var(--text);
			padding: 10px 12px;
			outline: none;
		}

		.input:focus {
			border-color: rgba(51, 214, 166, 0.50);
			box-shadow: 0 0 0 3px rgba(51, 214, 166, 0.18);
		}

		.select {
			appearance: none;
			background-image: linear-gradient(45deg, transparent 50%, rgba(255,255,255,0.65) 50%),
				linear-gradient(135deg, rgba(255,255,255,0.65) 50%, transparent 50%);
			background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 12px) calc(50% - 3px);
			background-size: 6px 6px, 6px 6px;
			background-repeat: no-repeat;
		}

		.table {
			width: 100%;
			border-collapse: separate;
			border-spacing: 0;
		}

		.table th {
			text-align: left;
			font-size: 12px;
			font-weight: 600;
			letter-spacing: 0.02em;
			color: rgba(255, 255, 255, 0.70);
			padding: 12px 14px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.12);
		}

		.table td {
			padding: 12px 14px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
			vertical-align: top;
		}

		.row:hover td {
			background: rgba(255, 255, 255, 0.05);
		}

		.kpi {
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.12);
			background: rgba(255, 255, 255, 0.05);
			padding: 14px;
		}

		.kpi .v {
			font-size: 22px;
			font-weight: 700;
		}

		.kpi .l {
			font-size: 12px;
			color: rgba(255, 255, 255, 0.60);
		}

		.toast {
			border: 1px solid rgba(255, 255, 255, 0.14);
			background: rgba(15, 23, 42, 0.85);
			border-radius: 14px;
			padding: 12px 14px;
		}

		.help-btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 18px;
			height: 18px;
			border-radius: 999px;
			border: 1px solid rgba(255, 255, 255, 0.18);
			background: rgba(255, 255, 255, 0.06);
			color: rgba(255, 255, 255, 0.72);
			font-size: 12px;
			line-height: 1;
			transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
		}

		.help-btn:hover {
			transform: translateY(-1px);
			background: rgba(255, 255, 255, 0.10);
			border-color: rgba(255, 255, 255, 0.26);
		}

		.help-pop {
			position: absolute;
			top: 24px;
			right: 0;
			z-index: 60;
			width: 280px;
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.14);
			background: rgba(15, 23, 42, 0.92);
			backdrop-filter: blur(10px);
			padding: 12px 12px;
			box-shadow: 0 20px 50px rgba(0,0,0,0.35);
		}

		.th-sort {
			cursor: pointer;
			user-select: none;
		}

		.th-sort:hover {
			color: rgba(255, 255, 255, 0.92);
		}

		.sort-ind {
			display: inline-block;
			margin-left: 6px;
			font-size: 10px;
			opacity: 0.75;
		}
	</style>
</head>
<body>
	<div id="app" class="min-h-screen">
		<!-- Header -->
		<header class="py-8">
			<div class="container mx-auto px-4">
				<div class="panel p-6">
					<div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
						<div>
							<div class="text-xs uppercase tracking-widest" style="color: var(--muted2)">AH / A股 与 H股</div>
							<h1 class="text-2xl md:text-3xl font-bold mt-1">每日推荐控制台</h1>
							<p class="text-sm mt-2" style="color: var(--muted)">点击交互，实时刷新、调整参数、导出结果。默认演示模式使用模拟数据。</p>
						</div>
						<div class="flex flex-wrap items-center gap-2">
							<span class="badge">接口: <span class="mono">/api/v1/*</span></span>
							<span class="badge">导出: <span class="mono">xlsx/csv</span></span>
							<span class="badge">模式: <span class="mono">演示/模拟</span></span>
						</div>
					</div>
					<div class="mt-5 flex flex-wrap gap-2">
						<button v-for="tab in tabs" :key="tab.id" class="btn" :class="currentTab === tab.id ? 'btn-primary' : ''" @click="currentTab = tab.id">
							<span class="mono">{{ tab.short }}</span>
							<span>{{ tab.name }}</span>
						</button>
							<button class="btn" :disabled="updating" @click="forceUpdate">{{ updating ? '更新中...' : '强制更新' }}</button>
							<button class="btn btn-secondary" :disabled="updating" @click="forceUpdateMock">模拟数据</button>
							<button class="btn btn-secondary" :disabled="updating" @click="resetRefreshState">重置状态</button>
							<span class="badge" style="margin-left: 6px">自动更新：每小时</span>
					</div>
				</div>
			</div>
		</header>

		<!-- Toast -->
		<div v-if="toast.show" class="container mx-auto px-4">
			<div class="toast mb-4">
				<div class="flex items-start justify-between gap-4">
					<div>
						<div class="text-sm font-semibold">{{ toast.title }}</div>
						<div class="text-sm mt-1" style="color: var(--muted)">{{ toast.message }}</div>
					</div>
					<button class="btn" @click="toast.show=false">关闭</button>
				</div>
			</div>
		</div>

		<!-- Content -->
		<main class="pb-12">
			<div class="container mx-auto px-4">
				<div v-if="currentTab === 'pair_trading'"><pair-trading :refresh-key="refreshKey" @toast="showToast"></pair-trading></div>
				<div v-if="currentTab === 'multi_factor'"><multi-factor :refresh-key="refreshKey" @toast="showToast"></multi-factor></div>
				<div v-if="currentTab === 'ml_prediction'"><ml-prediction :refresh-key="refreshKey" @toast="showToast"></ml-prediction></div>
				<div v-if="currentTab === 'etf_sector'"><etf-sector :refresh-key="refreshKey" @toast="showToast"></etf-sector></div>
				<div v-if="currentTab === 'watchlist'"><watchlist-tab :refresh-key="refreshKey" :selected-code="selectedResearchCode" @toast="showToast" @open-research="openResearch"></watchlist-tab></div>
				<div v-if="currentTab === 'research'"><research-tab :refresh-key="refreshKey" :selected-code="selectedResearchCode" @toast="showToast" @select-code="setResearchCode"></research-tab></div>
			</div>
		</main>

		<footer class="py-10">
			<div class="container mx-auto px-4">
				<div class="panel p-6">
					<div class="text-sm" style="color: var(--muted)">免责声明：本页面仅供研究学习，不构成投资建议。</div>
				</div>
			</div>
		</footer>
	</div>

	<script>
		const api = axios.create({
			baseURL: '',
			timeout: 30000,
			headers: { 'Content-Type': 'application/json' }
		})

		const HelpTip = {
			props: {
				title: { type: String, default: '说明' },
				text: { type: String, required: true },
			},
			data() {
				return { open: false }
			},
			mounted() {
				this._onDocClick = () => { this.open = false }
				document.addEventListener('click', this._onDocClick)
			},
			unmounted() {
				document.removeEventListener('click', this._onDocClick)
			},
			template: `
				<span class="relative inline-flex items-center" @click.stop>
					<button type="button" class="help-btn" @click.stop="open = !open" aria-label="术语说明">?</button>
					<div v-if="open" class="help-pop" @click.stop>
						<div class="text-xs font-semibold">{{ title }}</div>
						<div class="text-xs mt-1" style="color: var(--muted)">{{ text }}</div>
					</div>
				</span>
			`,
		}

		function clamp01(x) {
			if (x === null || x === undefined || Number.isNaN(x)) return 0
			return Math.max(0, Math.min(1, x))
		}

		function _toNum(v) {
			if (v === null || v === undefined) return null
			if (typeof v === 'number') return Number.isFinite(v) ? v : null
			if (typeof v === 'string') {
				const t = v.trim().replace('%', '')
				if (!t) return null
				const n = Number(t)
				return Number.isFinite(n) ? n : null
			}
			return null
		}

		function _cmp(a, b) {
			const na = _toNum(a)
			const nb = _toNum(b)
			if (na !== null && nb !== null) return na === nb ? 0 : (na < nb ? -1 : 1)
			const sa = (a === null || a === undefined) ? '' : String(a)
			const sb = (b === null || b === undefined) ? '' : String(b)
			return sa.localeCompare(sb, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' })
		}

		function sortBy(list, getVal, key, dir) {
			const arr = Array.isArray(list) ? list.slice() : []
			const d = dir === 1 ? 1 : -1
			arr.sort((x, y) => {
				const vx = getVal(x)
				const vy = getVal(y)
				const c = _cmp(vx, vy)
				if (c !== 0) return c * d
				// stable-ish tie-breaker
				return _cmp((x && x[key]) || '', (y && y[key]) || '') * d
			})
			return arr
		}

		async function exportData(data_type, format, emitToast) {
			try {
				const typeNameMap = {
					pair_trading: '配对交易',
					multi_factor: '多因子',
					ml_prediction: 'ML预测',
					all: '全部',
				}
				const typeName = typeNameMap[data_type] || data_type
				emitToast({ title: '导出中', message: `正在导出：${typeName} -> ${format}...` })
				const res = await api.post('/api/v1/export/', { data_type, format })
				if (!res.data || !res.data.success) {
					emitToast({ title: '导出失败', message: res.data && res.data.message ? res.data.message : '未知错误' })
					return
				}
				emitToast({ title: '导出成功', message: res.data.message })
				if (res.data.download_url) {
					window.open(res.data.download_url, '_blank')
				}
			} catch (e) {
				emitToast({ title: '导出失败', message: e && e.message ? e.message : String(e) })
			}
		}

		function normalizeCode(value) {
			return String(value || '').trim().toUpperCase()
		}

		function getErrorMessage(error) {
			if (error && error.response && error.response.data && error.response.data.detail) {
				return error.response.data.detail
			}
			return error && error.message ? error.message : String(error)
		}

		function formatFixed(value, digits = 2) {
			const n = _toNum(value)
			return n === null ? '-' : n.toFixed(digits)
		}

		function formatPercent(value, digits = 2) {
			const n = _toNum(value)
			return n === null ? '-' : `${n.toFixed(digits)}%`
		}

		function formatDisplayValue(value) {
			if (value === null || value === undefined || value === '') return '-'
			if (typeof value === 'number') {
				if (!Number.isFinite(value)) return '-'
				return Math.abs(value) >= 100 ? value.toFixed(2) : value.toFixed(4).replace(/\.?0+$/, '')
			}
			if (typeof value === 'boolean') return value ? 'true' : 'false'
			if (typeof value === 'object') return JSON.stringify(value)
			return String(value)
		}

		function prettyJson(value) {
			return JSON.stringify(value === undefined ? null : value, null, 2)
		}

		function toChartNumber(value) {
			const n = _toNum(value)
			return n === null ? null : n
		}

		function compactTableRows(rows, maxRows) {
			return Array.isArray(rows) ? rows.slice(0, maxRows) : []
		}

		function buildLabeledSummary(primary, secondary, tertiary, emptyHint) {
			return {
				primary: primary || '暂无结构化结论',
				secondary: secondary || '请展开原始输出查看完整细节。',
				tertiary: tertiary || emptyHint,
			}
		}

		const WATCHLIST_PINNED_KEY = 'ah-watchlist-pinned'
		const RECENT_RESEARCH_KEY = 'ah-research-recent'

		function readStoredCodes(key) {
			try {
				const raw = localStorage.getItem(key)
				if (!raw) return []
				const items = JSON.parse(raw)
				return Array.isArray(items) ? items.map(normalizeCode).filter(Boolean) : []
			} catch (_e) {
				return []
			}
		}

		function writeStoredCodes(key, items) {
			try {
				localStorage.setItem(key, JSON.stringify((items || []).map(normalizeCode).filter(Boolean)))
			} catch (_e) {
				// ignore storage failures
			}
		}

		function humanizeDirection(value) {
			const v = String(value || '').trim().toLowerCase()
			if (v === 'sell_ah') return '做空A / 做多H'
			if (v === 'buy_ah') return '做多A / 做空H'
			if (v === 'hold') return '暂时观望'
			if (v === 'premium_increase') return '溢价可能继续扩大'
			if (v === 'premium_decrease') return '溢价可能回落'
			if (v === 'stable' || v === 'flat') return '预计大体稳定'
			if (v === 'unknown') return '方向暂不明确'
			return formatDisplayValue(value)
		}

		function humanizeTradeDirection(value) {
			const v = String(value || '').trim().toLowerCase()
			if (v === 'long_a_short_h' || v === 'buy_ah') return '做多A / 做空H'
			if (v === 'short_a_long_h' || v === 'sell_ah') return '做空A / 做多H'
			return formatDisplayValue(value)
		}

		function humanizeMetricKey(key) {
			const map = {
				total_return_pct: '总收益率',
				annual_return_pct: '年化收益率',
				max_drawdown_pct: '最大回撤',
				sharpe_ratio: '夏普比率',
				win_rate: '胜率',
				win_rate_pct: '胜率',
				trades: '交易次数',
				trade_count: '交易次数',
				avg_trade_return_pct: '单笔平均收益',
				volatility_pct: '波动率',
			}
			return map[key] || '其他指标'
		}

		function humanizeBlockReason(value) {
			const v = String(value || '').trim().toLowerCase()
			if (v === 'edge_lt_cost') return '价差不足覆盖成本'
			if (v === 'data_quality') return '数据质量不足'
			if (v === 'ok') return '条件满足'
			return '暂不满足执行条件'
		}

		function humanizeBacktestMode(value) {
			const v = String(value || '').trim().toLowerCase()
			if (v === 'prices') return '价格驱动'
			return v ? '自定义模式' : '-'
		}

		const WatchlistTab = {
			emits: ['toast', 'open-research'],
			props: {
				refreshKey: { type: Number, default: 0 },
				selectedCode: { type: String, default: '' },
			},
			template: `
				<section class="grid grid-cols-1 lg:grid-cols-3 gap-4">
					<div class="panel p-6 lg:col-span-1">
						<div class="flex items-start justify-between gap-3">
							<div>
								<div class="text-xs uppercase tracking-widest" style="color: var(--muted2)">观察列表</div>
								<div class="text-xl font-bold mt-1">自选列表</div>
								<div class="text-sm mt-2" style="color: var(--muted)">输入 A 股代码后加入自选，并从列表直接跳转到研究页。</div>
							</div>
							<span class="badge">本地自选列表</span>
						</div>

						<label class="block mt-6">
							<div class="text-xs mb-1" style="color: var(--muted2)">A 股代码</div>
							<input class="input mono" placeholder="601398.SH" v-model="inputCode" @keyup.enter="addSymbol" />
							<div class="text-xs mt-2" style="color: var(--muted2)">支持 601398.SH 或 601398 形式，回车即可加入自选。</div>
						</label>

						<div class="mt-4 flex flex-wrap gap-2">
							<span class="text-xs" style="color: var(--muted2)">重点示例：</span>
							<button class="btn" @click="useExample('601398.SH')">601398.SH</button>
							<button class="btn" @click="useExample('601988.SH')">601988.SH</button>
						</div>

						<div class="mt-4 flex flex-wrap gap-2">
							<button class="btn btn-primary" @click="addSymbol" :disabled="submitting">{{ submitting ? '添加中...' : '添加' }}</button>
							<button class="btn" @click="fetchItems" :disabled="loading">{{ loading ? '刷新中...' : '刷新列表' }}</button>
						</div>

						<div class="mt-6 grid grid-cols-2 gap-3">
							<div class="kpi">
								<div class="v" style="color: var(--accent2)">{{ items.length }}</div>
								<div class="l">自选数量</div>
							</div>
							<div class="kpi">
								<div class="v mono text-base">{{ selectedCode || '-' }}</div>
								<div class="l">当前研究代码</div>
							</div>
						</div>
					</div>

					<div class="panel p-6 lg:col-span-2">
						<div class="flex items-center justify-between gap-3">
							<div>
								<div class="text-xs uppercase tracking-widest" style="color: var(--muted2)">列表</div>
								<div class="text-lg font-bold mt-1">已加入的股票</div>
							</div>
							<span class="badge">可删除，也可一键进入研究页</span>
						</div>

						<div class="mt-4 overflow-x-auto">
							<table class="table">
								<thead>
									<tr>
										<th>股票</th>
										<th>代码</th>
										<th>操作</th>
									</tr>
								</thead>
								<tbody>
									<tr v-for="item in items" :key="item.a_code" class="row">
										<td>
											<div class="flex flex-wrap items-center gap-2">
												<button class="btn" @click="togglePinned(item.a_code)">{{ isPinned(item.a_code) ? '已置顶' : '置顶' }}</button>
												<div class="font-semibold">{{ item.name || item.a_code }}</div>
												<span v-if="selectedCode === item.a_code" class="badge">当前研究</span>
											</div>

					return this.pinnedCodes.includes(normalizeCode(code))

				applyPinnedSort() {
					const pinned = new Set(this.pinnedCodes)
					this.items = [...this.items].sort((a, b) => {
						const ap = pinned.has(normalizeCode(a && a.a_code)) ? 1 : 0
						const bp = pinned.has(normalizeCode(b && b.a_code)) ? 1 : 0
						if (ap !== bp) return bp - ap
						return String(a && a.a_code || '').localeCompare(String(b && b.a_code || ''))
					})
				},
				togglePinned(code) {
					const normalized = normalizeCode(code)
					if (!normalized) return
					this.pinnedCodes = this.pinnedCodes.includes(normalized)

						: [normalized, ...this.pinnedCodes]
					writeStoredCodes(WATCHLIST_PINNED_KEY, this.pinnedCodes)
					this.applyPinnedSort()
				},
				useExample(code) {
					this.inputCode = normalizeCode(code)
				},

					const token = ++this.listRequestToken
					const epoch = this.listEpoch
					this.loading = true
					try {
						const res = await api.get('/api/v1/watchlist')
						if (token !== this.listRequestToken) return
						if (epoch !== this.listEpoch) return
						this.items = Array.isArray(res.data && res.data.items) ? res.data.items : []
						this.applyPinnedSort()
					} catch (e) {
						if (token !== this.listRequestToken) return
						if (epoch !== this.listEpoch) return
						this.emitToast({ title: '自选列表获取失败', message: getErrorMessage(e) })
					} finally {
						if (token !== this.listRequestToken) return
						this.loading = false
					}

						this.inputCode = ''

						await this.fetchItems()
					} catch (e) {

						this.emitToast({ title: '添加失败', message: getErrorMessage(e) })
					} finally {

						this.submitting = false
					}

						await this.fetchItems()
					} catch (e) {

					} finally {
						const next = { ...this.removingCodes }
						delete next[aCode]
						this.removingCodes = next
					}
				},

				}
			}

				applySelectedCode(code) {
					const normalized = normalizeCode(code)
					if (!normalized) return
					this.codeInput = normalized
					this.activeCode = normalized
					this.resetDisplayState()
					this.pushRecent(normalized)
					this.fetchAll(normalized)
				},
				async loadFromInput() {
					const normalized = normalizeCode(this.codeInput)
					if (!normalized) {
						this.emitToast({ title: '请输入代码', message: '请先输入有效的 A 股代码。' })
						return
					}
					this.codeInput = normalized
					this.activeCode = normalized
					this.resetDisplayState()
					this.pushRecent(normalized)
					this.$emit('select-code', normalized)
					await this.fetchAll(normalized)
				},
				resetDisplayState() {
					this.detail = null
					this.backtest = null
					this.detailError = ''
					this.backtestError = ''
					if (this.equityChart) {
						this.equityChart.dispose()
						this.equityChart = null
					}
					this.renderPremiumChart()
					this.renderEquityChart()
				},
				async fetchAll(code) {
					const normalized = normalizeCode(code)
					if (!normalized) return
					const token = ++this.requestToken
					this.loading = true
					this.activeCode = normalized
					this.detailError = ''
					this.backtestError = ''
					const requestCode = normalized
					try {
						const [detailRes, backtestRes] = await Promise.allSettled([
							api.get(`/api/v1/research/${encodeURIComponent(requestCode)}`),
							api.get(`/api/v1/research/${encodeURIComponent(requestCode)}/backtest`),
						])

						if (token !== this.requestToken || !this.isAlive) return

						if (detailRes.status === 'fulfilled') {
							this.detail = detailRes.value.data
						} else {
							this.detail = null
							this.detailError = getErrorMessage(detailRes.reason)
						}

						if (backtestRes.status === 'fulfilled') {
							this.backtest = backtestRes.value.data
						} else {
							this.backtest = null
							this.backtestError = getErrorMessage(backtestRes.reason)
						}

						if (this.detailError || this.backtestError) {
							this.emitToast({
								title: '研究数据加载不完整',
								message: [this.detailError, this.backtestError].filter(Boolean).join('；')
							})
						}
					} finally {
						if (token !== this.requestToken || !this.isAlive) return
						this.loading = false
						this.$nextTick(() => {
							if (!this.isAlive) return
							this.renderPremiumChart()
							this.renderEquityChart()
						})
					}
				},
				renderEmptyChart(chart, text) {
					if (!chart) return
					chart.clear()
					chart.setOption({
						backgroundColor: 'transparent',
						graphic: [{
							type: 'text',
							left: 'center',
							top: 'middle',
							style: {

					if (!this.premiumChart) return

					if (!series.length) {

			computed: {
				etfRows() {
					const rows = (this.data && this.data.etf_market && this.data.etf_market.top_by_turnover) ? this.data.etf_market.top_by_turnover : []
					const st = this.sortEtf || { key: 'turnover', dir: -1 }
					const key = st.key || 'turnover'
					const dir = st.dir || -1
					const getter = (r) => {
						if (!r) return null
						if (key === 'name') return r.name
						if (key === 'chg_pct') return r.chg_pct
						if (key === 'turnover') return r.turnover
						return r[key]
					}
					return sortBy(rows, getter, 'code', dir).slice(0, 30)
				}
			},
			mounted() {
				this.fetchAll()
			},
			watch: {
				refreshKey() {
					this.fetchAll()
				}
			},
			methods: {
				emitToast(payload) { this.$emit('toast', payload) },
				toggleSort(stateName, key, defaultDir) {
					const st = this[stateName]
					if (!st) return
					const defDir = (defaultDir === 1) ? 1 : -1
					if (st.key === key) {
						st.dir = st.dir === 1 ? -1 : 1
					} else {
						st.key = key
						st.dir = defDir
					}
				},
				sortIndicator(stateName, key) {
					const st = this[stateName]
					if (!st || st.key !== key) return ''
					return st.dir === 1 ? '▲' : '▼'
				},
				async fetchAll() {
					this.loading = true
					try {
						const [blk, health] = await Promise.all([
							api.get('/api/v1/etf-sector/'),
							api.get('/api/v1/data/health'),
						])
						this.data = blk.data
						this.health = health.data
					} catch (e) {
						this.emitToast({ title: '刷新失败', message: e && e.message ? e.message : String(e) })
					} finally {
						this.loading = false
					}
				}
			}
		}

		const app = Vue.createApp({
			components: {
				'watchlist-tab': WatchlistTab,
				'research-tab': ResearchTab,
				'pair-trading': PairTrading,
				'multi-factor': MultiFactor,
				'ml-prediction': MLPrediction,
				'etf-sector': EtfSector,
			},
			data() {
				return {
					currentTab: 'pair_trading',
					selectedResearchCode: '',
					refreshKey: 0,
					updating: false,
					tabs: [
						{ id: 'pair_trading', short: '01', name: '配对交易' },
						{ id: 'multi_factor', short: '02', name: '多因子' },
						{ id: 'ml_prediction', short: '03', name: 'ML预测' },
						{ id: 'etf_sector', short: '04', name: 'ETF&板块' },
						{ id: 'watchlist', short: '05', name: '自选' },
						{ id: 'research', short: '06', name: '个股研究' },
					],
					toast: { show: false, title: '', message: '' },
				}
			},
			methods: {
				setResearchCode(code) {
					this.selectedResearchCode = normalizeCode(code)
				},
				openResearch(code) {
					const normalized = normalizeCode(code)
					if (!normalized) return
					this.selectedResearchCode = normalized
					this.currentTab = 'research'
				},
				showToast(payload) {
					this.toast.title = payload.title || '提示'
					this.toast.message = payload.message || ''
					this.toast.show = true
					window.clearTimeout(this._toastTimer)
					this._toastTimer = window.setTimeout(() => { this.toast.show = false }, 3500)
				},
				async forceUpdate() {
				if (this.updating) return
				this.updating = true
				try {
					this.showToast({ title: '更新中', message: '正在强制更新最新报告（可能需要几十秒）...' })
					const res = await api.post('/api/v1/report/refresh', null, { params: { mode: 'live', force: true } })
					const genAt = res && res.data ? (res.data.generated_at || '') : ''
					this.refreshKey += 1
					this.showToast({ title: '更新完成', message: genAt ? `已生成最新报告：${genAt}` : '已生成最新报告' })
				} catch (e) {
					const status = e && e.response ? e.response.status : null
					const detail = e && e.response && e.response.data ? e.response.data.detail : ''
					if (status === 409) {
						this.showToast({ title: '更新进行中', message: '后台正在生成报告（可能是你刚点过，或系统正在每小时自动更新）。我会自动等待完成...' })
						await this._waitForRefreshDone()
						return
					}
					if (detail.includes('empty_report') || detail.includes('network failure')) {
						this.showToast({ title: '网络连接失败', message: '无法获取实时数据。旧数据已保留。您可以点击“模拟数据”按钮使用演示数据。' })
						return
					}
					this.showToast({ title: '更新失败', message: detail || (e && e.message ? e.message : String(e)) })
				} finally {
					this.updating = false
				}
			},
			async forceUpdateMock() {
				if (this.updating) return
				this.updating = true
				try {
					this.showToast({ title: '更新中', message: '正在生成模拟数据...' })
					const res = await api.post('/api/v1/report/refresh', null, { params: { mode: 'mock', force: true } })
					const genAt = res && res.data ? (res.data.generated_at || '') : ''
					this.refreshKey += 1
					this.showToast({ title: '模拟数据已生成', message: genAt ? `报告时间：${genAt}` : '模拟数据已生成' })
				} catch (e) {
					const status = e && e.response ? e.response.status : null
					if (status === 409) {
						this.showToast({ title: '更新进行中', message: '后台正在生成报告，请稍后...' })
						return
					}
					this.showToast({ title: '生成失败', message: e && e.message ? e.message : String(e) })
				} finally {
					this.updating = false
				}
				},
				async _waitForRefreshDone() {
					const maxTries = 25
					for (let i = 0; i < maxTries; i++) {
						try {
							await new Promise(r => setTimeout(r, 3000))
							const res = await api.get('/api/v1/report/refresh/status')
							const st = res && res.data ? (res.data.status || {}) : {}
							if (!st.in_progress) {
								this.refreshKey += 1
								this.showToast({ title: '更新完成', message: st.last_success_at ? `已生成最新报告：${st.last_success_at}` : '已生成最新报告' })
								return
							}
						} catch (e) {
							// ignore transient errors during polling
						}
					}
				this.showToast({ title: '仍在更新中', message: '后台更新耗时较长，请稍后再点“强制更新”，或直接刷新页面查看更新时间。' })
			},
			async resetRefreshState() {
				if (this.updating) return
				this.updating = true
				try {
					const res = await api.post('/api/v1/report/refresh/reset')
					const wasStuck = res && res.data ? res.data.was_stuck : false
					if (wasStuck) {
						this.showToast({ title: '状态已重置', message: '之前有卡住的刷新任务，现在已清除。您可以重新尝试更新。' })
					} else {
						this.showToast({ title: '状态正常', message: '没有卡住的任务。' })
					}
				} catch (e) {
					this.showToast({ title: '重置失败', message: e && e.message ? e.message : String(e) })
			} finally {
				this.updating = false
			}
			}
		}
		})

		app.mount('#app')
	</script>
</body>
</html>
