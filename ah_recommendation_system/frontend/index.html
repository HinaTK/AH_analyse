<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AH股每日推荐系统</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
	<style>
		:root {
			--bg0: #0b1220;
			--bg1: #0e1a2e;
			--card: rgba(255, 255, 255, 0.06);
			--card2: rgba(255, 255, 255, 0.08);
			--stroke: rgba(255, 255, 255, 0.12);
			--text: rgba(255, 255, 255, 0.92);
			--muted: rgba(255, 255, 255, 0.66);
			--muted2: rgba(255, 255, 255, 0.50);
			--accent: #33d6a6;
			--accent2: #3b82f6;
			--warn: #f59e0b;
			--bad: #ef4444;
		}

		html, body {
			height: 100%;
		}

		body {
			font-family: "IBM Plex Sans", ui-sans-serif, system-ui;
			background: radial-gradient(1000px 600px at 20% 0%, rgba(51, 214, 166, 0.12), transparent 60%),
				radial-gradient(1000px 600px at 80% 0%, rgba(59, 130, 246, 0.16), transparent 55%),
				linear-gradient(180deg, var(--bg0), var(--bg1));
			color: var(--text);
		}

		.mono {
			font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular;
		}

		.panel {
			background: var(--card);
			border: 1px solid var(--stroke);
			border-radius: 14px;
			backdrop-filter: blur(10px);
		}

		.panel:hover {
			background: var(--card2);
		}

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			padding: 10px 12px;
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.14);
			background: rgba(255, 255, 255, 0.06);
			color: var(--text);
			transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
		}

		.btn:hover {
			transform: translateY(-1px);
			background: rgba(255, 255, 255, 0.10);
			border-color: rgba(255, 255, 255, 0.22);
		}

		.btn-primary {
			border-color: rgba(51, 214, 166, 0.35);
			background: rgba(51, 214, 166, 0.14);
		}

		.btn-primary:hover {
			background: rgba(51, 214, 166, 0.18);
		}

		.btn-blue {
			border-color: rgba(59, 130, 246, 0.35);
			background: rgba(59, 130, 246, 0.14);
		}

		.badge {
			border: 1px solid rgba(255, 255, 255, 0.14);
			background: rgba(255, 255, 255, 0.06);
			border-radius: 999px;
			padding: 6px 10px;
			font-size: 12px;
			color: var(--muted);
		}

		.input {
			width: 100%;
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.16);
			background: rgba(15, 23, 42, 0.55);
			color: var(--text);
			padding: 10px 12px;
			outline: none;
		}

		.input:focus {
			border-color: rgba(51, 214, 166, 0.50);
			box-shadow: 0 0 0 3px rgba(51, 214, 166, 0.18);
		}

		.select {
			appearance: none;
			background-image: linear-gradient(45deg, transparent 50%, rgba(255,255,255,0.65) 50%),
				linear-gradient(135deg, rgba(255,255,255,0.65) 50%, transparent 50%);
			background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 12px) calc(50% - 3px);
			background-size: 6px 6px, 6px 6px;
			background-repeat: no-repeat;
		}

		.table {
			width: 100%;
			border-collapse: separate;
			border-spacing: 0;
		}

		.table th {
			text-align: left;
			font-size: 12px;
			font-weight: 600;
			letter-spacing: 0.02em;
			color: rgba(255, 255, 255, 0.70);
			padding: 12px 14px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.12);
		}

		.table td {
			padding: 12px 14px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
			vertical-align: top;
		}

		.row:hover td {
			background: rgba(255, 255, 255, 0.05);
		}

		.kpi {
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.12);
			background: rgba(255, 255, 255, 0.05);
			padding: 14px;
		}

		.kpi .v {
			font-size: 22px;
			font-weight: 700;
		}

		.kpi .l {
			font-size: 12px;
			color: rgba(255, 255, 255, 0.60);
		}

		.toast {
			border: 1px solid rgba(255, 255, 255, 0.14);
			background: rgba(15, 23, 42, 0.85);
			border-radius: 14px;
			padding: 12px 14px;
		}

		.help-btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 18px;
			height: 18px;
			border-radius: 999px;
			border: 1px solid rgba(255, 255, 255, 0.18);
			background: rgba(255, 255, 255, 0.06);
			color: rgba(255, 255, 255, 0.72);
			font-size: 12px;
			line-height: 1;
			transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
		}

		.help-btn:hover {
			transform: translateY(-1px);
			background: rgba(255, 255, 255, 0.10);
			border-color: rgba(255, 255, 255, 0.26);
		}

		.help-pop {
			position: absolute;
			top: 24px;
			right: 0;
			z-index: 60;
			width: 280px;
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.14);
			background: rgba(15, 23, 42, 0.92);
			backdrop-filter: blur(10px);
			padding: 12px 12px;
			box-shadow: 0 20px 50px rgba(0,0,0,0.35);
		}

		.th-sort {
			cursor: pointer;
			user-select: none;
		}

		.th-sort:hover {
			color: rgba(255, 255, 255, 0.92);
		}

		.sort-ind {
			display: inline-block;
			margin-left: 6px;
			font-size: 10px;
			opacity: 0.75;
		}

		.badge-strong {
			border-color: rgba(51, 214, 166, 0.30);
			background: rgba(51, 214, 166, 0.12);
			color: rgba(207, 250, 239, 0.96);
		}

		.badge-warn {
			border-color: rgba(245, 158, 11, 0.30);
			background: rgba(245, 158, 11, 0.12);
			color: rgba(254, 243, 199, 0.96);
		}

		.badge-weak {
			border-color: rgba(239, 68, 68, 0.28);
			background: rgba(239, 68, 68, 0.12);
			color: rgba(254, 226, 226, 0.96);
		}
	</style>
</head>
<body>
	<div id="app" class="min-h-screen">
		<!-- Header -->
		<header class="py-8">
			<div class="container mx-auto px-4">
				<div class="panel p-6">
					<div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
						<div>
							<div class="text-xs uppercase tracking-widest" style="color: var(--muted2)">AH / A股 与 H股</div>
							<h1 class="text-2xl md:text-3xl font-bold mt-1">每日推荐控制台</h1>
							<p class="text-sm mt-2" style="color: var(--muted)">按各模块来源和时间核对结果。历史报告不是实时行情，模拟数据不能当作当日判断。</p>
						</div>
						<div class="flex flex-wrap items-center gap-2">
							<span class="badge">接口: <span class="mono">/api/v1/*</span></span>
							<span class="badge">导出: <span class="mono">xlsx/csv</span></span>
							<span class="badge">模式: <span class="mono">按模块核对来源/时间</span></span>
						</div>
					</div>
					<div class="mt-5 flex flex-wrap gap-2 items-center">
						<button v-for="tab in primaryTabs" :key="tab.id" class="btn" :class="currentTab === tab.id ? 'btn-primary' : ''" @click="currentTab = tab.id">
							<span class="mono">{{ tab.short }}</span>
							<span>{{ tab.name }}</span>
						</button>
						<button v-if="secondaryTabs.length" class="btn btn-secondary" @click="showSecondaryTabs = !showSecondaryTabs">
							<span class="mono">···</span>
							<span>{{ showSecondaryTabs ? '收起其他策略' : '更多策略' }}</span>
						</button>
						<template v-if="showSecondaryTabs">
							<button v-for="tab in secondaryTabs" :key="tab.id" class="btn" :class="currentTab === tab.id ? 'btn-primary' : ''" @click="currentTab = tab.id">
								<span class="mono">{{ tab.short }}</span>
								<span>{{ tab.name }}</span>
							</button>
						</template>
							<button class="btn" :disabled="updating" @click="forceUpdate">{{ updating ? '更新中...' : '强制更新' }}</button>
							<button class="btn btn-secondary" :disabled="updating" @click="forceUpdateMock">模拟数据</button>
							<button class="btn btn-secondary" :disabled="updating" @click="resetRefreshState">重置状态</button>
							<span class="badge" style="margin-left: 6px">自动更新：每小时</span>
					</div>
				</div>
			</div>
		</header>

		<!-- Toast -->
		<div v-if="toast.show" class="container mx-auto px-4">
			<div class="toast mb-4">
				<div class="flex items-start justify-between gap-4">
					<div>
						<div class="text-sm font-semibold">{{ toast.title }}</div>
						<div class="text-sm mt-1" style="color: var(--muted)">{{ toast.message }}</div>
					</div>
					<button class="btn" @click="toast.show=false">关闭</button>
				</div>
			</div>
		</div>

		<!-- Content -->
		<main class="pb-12">
			<div class="container mx-auto px-4">
				<div v-if="currentTab === 'pair_trading'"><pair-trading :refresh-key="refreshKey" @toast="showToast"></pair-trading></div>
				<div v-if="currentTab === 'multi_factor'"><multi-factor :refresh-key="refreshKey" @toast="showToast"></multi-factor></div>
				<div v-if="currentTab === 'ml_prediction'"><ml-prediction :refresh-key="refreshKey" @toast="showToast"></ml-prediction></div>
					<div v-if="currentTab === 'etf_sector'"><etf-sector :refresh-key="refreshKey" @toast="showToast"></etf-sector></div>
				<div v-if="currentTab === 'review'"><review-module :refresh-key="refreshKey" @toast="showToast"></review-module></div>
				<div v-if="currentTab === 'daily_recommend'"><daily-recommendation :refresh-key="refreshKey" @toast="showToast"></daily-recommendation></div>
			</div>
		</main>

		<footer class="py-10">
			<div class="container mx-auto px-4">
				<div class="panel p-6">
					<div class="text-sm" style="color: var(--muted)">免责声明：本页面仅供研究学习，不构成投资建议。</div>
				</div>
			</div>
		</footer>
	</div>

	<script>
		const api = axios.create({
			baseURL: '',
			timeout: 30000,
			headers: { 'Content-Type': 'application/json' }
		})
		const ETF_SECTOR_TIMEOUT = 90000

		const HelpTip = {
			props: {
				title: { type: String, default: '说明' },
				text: { type: String, required: true },
			},
			data() {
				return { open: false }
			},
			mounted() {
				this._onDocClick = () => { this.open = false }
				document.addEventListener('click', this._onDocClick)
			},
			unmounted() {
				document.removeEventListener('click', this._onDocClick)
			},
			template: `
				<span class="relative inline-flex items-center" @click.stop>
					<button type="button" class="help-btn" @click.stop="open = !open" aria-label="术语说明">?</button>
					<div v-if="open" class="help-pop" @click.stop>
						<div class="text-xs font-semibold">{{ title }}</div>
						<div class="text-xs mt-1" style="color: var(--muted)">{{ text }}</div>
					</div>
				</span>
			`,
		}

		function clamp01(x) {
			if (x === null || x === undefined || Number.isNaN(x)) return 0
			return Math.max(0, Math.min(1, x))
		}

		function _toNum(v) {
			if (v === null || v === undefined) return null
			if (typeof v === 'number') return Number.isFinite(v) ? v : null
			if (typeof v === 'string') {
				const t = v.trim().replace('%', '')
				if (!t) return null
				const n = Number(t)
				return Number.isFinite(n) ? n : null
			}
			return null
		}

		function _cmp(a, b) {
			const na = _toNum(a)
			const nb = _toNum(b)
			if (na !== null && nb !== null) return na === nb ? 0 : (na < nb ? -1 : 1)
			const sa = (a === null || a === undefined) ? '' : String(a)
			const sb = (b === null || b === undefined) ? '' : String(b)
			return sa.localeCompare(sb, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' })
		}

		function sortBy(list, getVal, key, dir) {
			const arr = Array.isArray(list) ? list.slice() : []
			const d = dir === 1 ? 1 : -1
			arr.sort((x, y) => {
				const vx = getVal(x)
				const vy = getVal(y)
				const c = _cmp(vx, vy)
				if (c !== 0) return c * d
				// stable-ish tie-breaker
				return _cmp((x && x[key]) || '', (y && y[key]) || '') * d
			})
			return arr
		}

		async function exportData(data_type, format, emitToast) {
			try {
				const typeNameMap = {
					pair_trading: '配对交易',
					multi_factor: '多因子',
					ml_prediction: 'ML预测',
					etf_trend: 'ETF趋势',
					all: '全部',
				}
				const typeName = typeNameMap[data_type] || data_type
				emitToast({ title: '导出中', message: `正在导出：${typeName} -> ${format}...` })
				const res = await api.post('/api/v1/export/', { data_type, format })
				if (!res.data || !res.data.success) {
					emitToast({ title: '导出失败', message: res.data && res.data.message ? res.data.message : '未知错误' })
					return
				}
				emitToast({ title: '导出成功', message: res.data.message })
				if (res.data.download_url) {
					window.open(res.data.download_url, '_blank')
				}
			} catch (e) {
				emitToast({ title: '导出失败', message: e && e.message ? e.message : String(e) })
			}
		}

		const PairTrading = {
			emits: ['toast'],
			components: { 'help-tip': HelpTip },
			props: {
				refreshKey: { type: Number, default: 0 },
			},
			template: `
				<section class="grid grid-cols-1 lg:grid-cols-3 gap-4">
					<div class="panel p-6 lg:col-span-1">
						<div class="flex items-start justify-between gap-3">
							<div>
								<div class="text-xs uppercase tracking-widest" style="color: var(--muted2)">策略 01</div>
								<div class="text-xl font-bold mt-1">AH溢价配对交易</div>
								<div class="text-sm mt-2" style="color: var(--muted)">通过溢价偏离历史均值给出 买入/卖出/观望 信号。</div>
							</div>
							<span class="badge mono">配对交易</span>
						</div>

						<div class="mt-6 grid grid-cols-1 gap-3">
							<label>
								<div class="text-xs mb-1" style="color: var(--muted2)">最大持仓数</div>
								<input class="input" type="number" min="1" max="50" v-model.number="params.max_positions" />
							</label>
							<label>
								<div class="text-xs mb-1" style="color: var(--muted2)">股票列表（逗号分隔）</div>
								<input class="input mono" placeholder="601988.SH,601398.SH" v-model="params.stock_list" />
							</label>
							<label>
								<div class="text-xs mb-1" style="color: var(--muted2)">导出格式</div>
								<select class="input select" v-model="exportFormat">
									<option value="xlsx">xlsx</option>
									<option value="csv">csv</option>
								</select>
							</label>
						</div>

						<div class="mt-4 flex flex-wrap gap-2">
							<button class="btn btn-primary" @click="fetchData" :disabled="loading">{{ loading ? '刷新中...' : '刷新' }}</button>
							<button class="btn btn-blue" @click="doExport" :disabled="loading">导出</button>
						</div>

						<div class="mt-6 grid grid-cols-3 gap-3">
							<div class="kpi">
								<div class="v" style="color: var(--accent)">{{ summary.buy_signals || 0 }}</div>
								<div class="l">买A卖H</div>
							</div>
							<div class="kpi">
								<div class="v" style="color: var(--bad)">{{ summary.sell_signals || 0 }}</div>
								<div class="l">卖A买H</div>
							</div>
							<div class="kpi">
								<div class="v" style="color: var(--warn)">{{ summary.hold_signals || 0 }}</div>
								<div class="l">观望</div>
							</div>
						</div>

						<div class="mt-4 text-xs" style="color: var(--muted2)">更新时间：<span class="mono">{{ data.generated_at || '-' }}</span></div>
						<div class="mt-2 text-xs" style="color: var(--muted2)">回测：<span class="mono">{{ (backtest && backtest.generated_at) ? backtest.generated_at : '-' }}</span></div>
					</div>

						<div class="panel p-6 lg:col-span-2">
							<div class="flex items-center justify-between gap-3">
								<div>
									<div class="text-xs uppercase tracking-widest" style="color: var(--muted2)">概览</div>
									<div class="text-lg font-bold mt-1">主要信号</div>
								</div>
								<div class="badge">展示：置信度 / 溢价率</div>
							</div>
						<div class="mt-4" style="height: 280px" ref="chartEl"></div>

						<div class="mt-6">
							<div class="text-sm font-semibold">卖出A股（溢价偏高）</div>
							<div class="mt-3 overflow-x-auto">
								<table class="table">
									<thead>
										<tr>
											<th class="th-sort" @click="toggleSort('sortSell','name', 1)">股票<span class="sort-ind">{{ sortIndicator('sortSell','name') }}</span></th>
											<th class="th-sort" @click="toggleSort('sortSell','current_premium', -1)"><span class="inline-flex items-center gap-2">溢价(%)<help-tip title="溢价" text="溢价(%) = A股收盘价 / (H股收盘价×港币兑人民币) - 1。正值表示A相对H更贵。"></help-tip></span><span class="sort-ind">{{ sortIndicator('sortSell','current_premium') }}</span></th>
											<th class="th-sort" @click="toggleSort('sortSell','zscore', -1)"><span class="inline-flex items-center gap-2">Z值<help-tip title="Z值" text="Z值 = (当前溢价 - 历史均值) / 历史标准差。绝对值越大表示偏离越明显。"></help-tip></span><span class="sort-ind">{{ sortIndicator('sortSell','zscore') }}</span></th>
											<th class="th-sort" @click="toggleSort('sortSell','confidence', -1)"><span class="inline-flex items-center gap-2">置信度<help-tip title="置信度" text="由溢价偏离强度映射得到的 0~1 指标，仅用于排序展示，不代表真实胜率。"></help-tip></span><span class="sort-ind">{{ sortIndicator('sortSell','confidence') }}</span></th>
											<th class="th-sort" @click="toggleSort('sortSell','position_size', -1)"><span class="inline-flex items-center gap-2">仓位<help-tip title="仓位" text="建议仓位(0~1)，基于置信度与偏离度的简单函数。回测/实盘需自行做风险与资金管理。"></help-tip></span><span class="sort-ind">{{ sortIndicator('sortSell','position_size') }}</span></th>
										</tr>
									</thead>
									<tbody>
										<tr v-for="s in sellRows" :key="s.a_code" class="row">
											<td>
												<div class="font-semibold">{{ s.name }}</div>
												<div class="mono text-xs" style="color: var(--muted2)">{{ s.a_code }} / {{ s.h_code }}</div>
											</td>
											<td class="mono">{{ s.current_premium }}</td>
											<td class="mono">{{ s.zscore }}</td>
											<td class="mono">{{ s.confidence }}</td>
											<td class="mono">{{ s.position_size }}</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>

							<div class="mt-8">
								<div class="flex items-center justify-between gap-3">
									<div>
										<div class="text-xs uppercase tracking-widest" style="color: var(--muted2)">回测</div>
										<div class="text-lg font-bold mt-1">配对交易（落盘）</div>
									</div>
									<div class="flex items-center gap-2">
										<span class="badge mono">/api/v1/backtest/pair-trading/latest</span>
										<button class="btn" @click="fetchBacktest" :disabled="loadingBacktest">{{ loadingBacktest ? '回测刷新中...' : '刷新回测' }}</button>
									</div>
								</div>

			computed: {

					const codes = (this.trendControls.codes || '').trim()

						|| this.normalizeTrendNumber(this.trendControls.lookback_short, this.trendDefaults.lookback_short) !== this.trendDefaults.lookback_short
						|| this.normalizeTrendNumber(this.trendControls.lookback_mid, this.trendDefaults.lookback_mid) !== this.trendDefaults.lookback_mid

				},
				trendQueryParams() {
					const params = { source: this.trendHasCustomSettings ? 'live' : 'stored' }
					if (!this.trendHasCustomSettings) return params
					return {
						...params,
						codes: (this.trendControls.codes || '').trim() || undefined,
						lookback_short: this.normalizeTrendNumber(this.trendControls.lookback_short, this.trendDefaults.lookback_short),

						breakout_window: this.normalizeTrendNumber(this.trendControls.breakout_window, this.trendDefaults.breakout_window),
					}
				},
				trendBlock() {
					if (this.trendData) return this.trendData
					if (this.data && this.data.etf_trend) return this.data.etf_trend
					return {}
				},
				trendSummary() {
					return (this.trendBlock && this.trendBlock.summary) ? this.trendBlock.summary : {}
				},

					return (this.trendBlock && this.trendBlock.coverage) ? this.trendBlock.coverage : {}
				},
				trendRows() {
					const rows = (this.trendBlock && this.trendBlock.recommendations) ? this.trendBlock.recommendations.slice() : []
					const filtered = this.trendControls.onlyFocus ? rows.filter(r => (r && r.recommendation) === '优先关注') : rows
					filtered.sort((a, b) => {
						const pa = Number.isFinite(Number(a && a.recommendation_priority)) ? Number(a.recommendation_priority) : 9
						const pb = Number.isFinite(Number(b && b.recommendation_priority)) ? Number(b.recommendation_priority) : 9
						if (pa !== pb) return pa - pb
						const sa = Number.isFinite(Number(a && a.trend_score)) ? Number(a.trend_score) : -999
						const sb = Number.isFinite(Number(b && b.trend_score)) ? Number(b.trend_score) : -999
						if (sa !== sb) return sb - sa
						return _cmp((a && a.code) || '', (b && b.code) || '')
					})
					return filtered

						breakoutSummary() {

								if (value === 'confirmed_leader') return '已确认'
								if (value === 'crowded_risk') return '偏拥挤'
								return value || ''

								if (n >= 0.75) return '高'
								if (n >= 0.5) return '中'
								return '低'
							}
							const buildEvidenceLines = (dims, isCrowded) => {
								dims = dims || {}
								const lines = [
									{ label: '趋势', value: (dims.trend || {}).summary || '暂无' },

									{ label: 'ETF验证', value: (dims.etf_confirmation || {}).summary || '暂无' },
									{ label: 'ETF广度', value: (dims.etf_breadth || {}).summary || '暂无广度确认' },
									{ label: '持续性', value: (dims.persistence || {}).summary || '暂无' },
									{ label: '行业确认', value: (dims.industry_confirmation || {}).summary || '暂无' },
									{ label: '交叉共振', value: (dims.source_confirmation || {}).summary || '暂无' },
								]
								if (isCrowded) lines.push({ label: '拥挤风险', value: (dims.crowding || {}).summary || '暂无' })
								return lines
							}

								stage: item && item.stage ? item.stage : '',
								stageLabel: stageLabel(item && item.stage),

								evidenceLine: (Array.isArray(item && item.evidence) ? item.evidence.slice(0, 3) : []).filter(Boolean).join('；'),
								evidenceLines: buildEvidenceLines(item && item.reason_dimensions, crowdedThemes.has(item && item.theme) || (item && item.stage) === 'crowded_risk'),
								etfLine: (Array.isArray(item && item.related_etfs) && item.related_etfs.length)
									? `相关ETF：${item.related_etfs.slice(0, 2).map(it => it.name || it.code).join(' / ')}`
									: '',
						}))
						const crowdedThemes = new Set(((this.data && this.data.crowded_risks) || []).map(item => item && item.theme).filter(Boolean))
						const crowdedOnly = ((this.data && this.data.crowded_risks) || []).filter(item => item && item.theme && !(((this.data && this.data.confirmed_leaders) || []).some(leader => leader && leader.theme === item.theme)))
						const updatedAt = ((this.data && this.data.generated_at) || (this.data && this.data.trend && this.data.trend.generated_at) || '-')
						return {
							potentialBreakouts: toCards(this.data && this.data.potential_breakouts),
							confirmedLeaders: toCards(this.data && this.data.confirmed_leaders, crowdedThemes),
							crowdedRisks: toCards(crowdedOnly),
							updatedAt,
						}
					},
					etfRows() {
						const rows = (this.data && this.data.etf_market && this.data.etf_market.top_by_turnover) ? this.data.etf_market.top_by_turnover : []
					const st = this.sortEtf || { key: 'turnover', dir: -1 }
					const key = st.key || 'turnover'
					const dir = st.dir || -1
					const getter = (r) => {
						if (!r) return null
						if (key === 'name') return r.name
						if (key === 'chg_pct') return r.chg_pct
						if (key === 'turnover') return r.turnover
						return r[key]
					}
					return sortBy(rows, getter, 'code', dir).slice(0, 30)
				}
			},
			mounted() {
				this.$nextTick(() => {
					if (this.$refs.trendBacktestChartEl) {
						this.backtestChart = echarts.init(this.$refs.trendBacktestChartEl)
					}
				})
				this.fetchAll()
			},
			unmounted() {
				if (this.backtestChart) {
					this.backtestChart.dispose()
					this.backtestChart = null
				}
			},
			watch: {
				refreshKey() {
					this.fetchAll()
				}
			},
			methods: {
				emitToast(payload) { this.$emit('toast', payload) },
				normalizeTrendNumber(value, fallback) {
					const n = Number(value)
					return Number.isFinite(n) ? Math.round(n) : fallback
				},
				resetTrendControls() {
					this.trendControls = { ...this.trendDefaults }
					this.fetchAll()
				},
				badgeClass(label) {
					if (!label) return ''
					if (['优先关注', '强势上涨', '震荡偏强', '偏强轮动', '结构偏强'].includes(label)) return 'badge-strong'
					if (['持有观察', '震荡', '震荡分化'].includes(label)) return 'badge-warn'
					if (['暂不关注', '弱势下行', '震荡偏弱', '风险偏弱', '数据缺失', '样本不足'].includes(label)) return 'badge-weak'
					return ''
				},
				scoreColor(v, isReturn) {
					const n = Number(v)
					if (!Number.isFinite(n)) return 'var(--muted)'
					if (isReturn) return n >= 0 ? 'rgba(51,214,166,0.95)' : 'rgba(248,113,113,0.95)'
					if (n >= 70) return 'rgba(51,214,166,0.95)'
					if (n >= 50) return 'rgba(245,158,11,0.95)'
					return 'rgba(248,113,113,0.95)'
				},
				fmtPct(v) {
					if (v === null || v === undefined) return '-'
					const n = Number(v)
					if (!Number.isFinite(n)) return '-'
					return n.toFixed(2)
				},
				fmtNum(v, digits = 2) {
					if (v === null || v === undefined) return '-'
					const n = Number(v)
					if (!Number.isFinite(n)) return '-'
					return n.toFixed(digits)
				},
				fmtSigned(v, digits = 2, withPlus = true, suffix = '%') {
					if (v === null || v === undefined) return '-'
					const n = Number(v)
					if (!Number.isFinite(n)) return '-'
					const prefix = withPlus && n > 0 ? '+' : ''
					return prefix + n.toFixed(digits) + suffix
				},
				fmtRatio(v) {
					if (v === null || v === undefined) return '-'
					const n = Number(v)
					if (!Number.isFinite(n)) return '-'
					return (n * 100).toFixed(1) + '%'
				},
					formatReasons(items) {
						if (!Array.isArray(items) || items.length === 0) return '暂无说明'
						return items.join('；')
					},
					isAllFetchFailedTrend(block) {
						if (!block || typeof block !== 'object') return false
					const coverage = block.coverage || {}
					const universeCount = Number(coverage.universe_count)
					const successCount = Number(coverage.success_count)
					const failedCount = Number(coverage.failed_count)
					return Number.isFinite(universeCount)
						&& universeCount > 0
						&& successCount === 0
						&& failedCount === universeCount
				},
					resolveTrendPayload(trendPayload, storedTrend, requestedLiveTrend) {
						if (!requestedLiveTrend) return trendPayload || storedTrend || null
						if (trendPayload && !this.isAllFetchFailedTrend(trendPayload)) return trendPayload
						return storedTrend || trendPayload || null
					},
					isTimeoutError(err) {
						if (!err) return false
						return err.code === 'ECONNABORTED' || String(err.message || '').toLowerCase().includes('timeout')
					},
					renderTrendBacktestChart() {
					if (!this.backtestChart && this.$refs.trendBacktestChartEl) {
						this.backtestChart = echarts.init(this.$refs.trendBacktestChartEl)
					}
					if (!this.backtestChart) return
					const curve = (this.trendBacktest && this.trendBacktest.equity_curve) ? this.trendBacktest.equity_curve : []
					const dates = curve.map(item => item.date)
					const values = curve.map(item => item.equity)
					this.backtestChart.setOption({
						backgroundColor: 'transparent',
						grid: { left: 18, right: 12, top: 18, bottom: 24, containLabel: true },
						tooltip: { trigger: 'axis' },
						xAxis: { type: 'category', data: dates, axisLabel: { color: 'rgba(255,255,255,0.55)', showMaxLabel: true, showMinLabel: true } },
						yAxis: { type: 'value', axisLabel: { color: 'rgba(255,255,255,0.55)' }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.08)' } } },
						series: [
							{ type: 'line', data: values, smooth: true, symbol: 'none', lineStyle: { width: 2, color: 'rgba(51,214,166,0.95)' }, areaStyle: { color: 'rgba(51,214,166,0.12)' } }
						]
					})
					this.backtestChart.resize()
				},
				toggleSort(stateName, key, defaultDir) {
					const st = this[stateName]
					if (!st) return
					const defDir = (defaultDir === 1) ? 1 : -1
					if (st.key === key) {
						st.dir = st.dir === 1 ? -1 : 1
					} else {
						st.key = key
						st.dir = defDir
					}
				},
				sortIndicator(stateName, key) {
					const st = this[stateName]
					if (!st || st.key !== key) return ''
					return st.dir === 1 ? '▲' : '▼'
				},
					async fetchAll() {
						this.loading = true
						try {
							const trendParams = this.trendQueryParams
							const [blkRes, trendRes, healthRes, historyRes] = await Promise.allSettled([
								api.get('/api/v1/etf-sector/', { params: { source: 'live' }, timeout: ETF_SECTOR_TIMEOUT }),
								api.get('/api/v1/etf-sector/trend', { params: trendParams, timeout: ETF_SECTOR_TIMEOUT }),
								api.get('/api/v1/data/health'),
								api.get('/api/v1/etf-sector/trend/history', { params: { limit: 8 } }),
							])
							if (blkRes.status === 'fulfilled') {
								this.data = blkRes.value.data
							} else {
								if (this.isTimeoutError(blkRes.reason)) {
									throw new Error('ETF 页面实时数据加载超时，请稍后重试')
								}
								const storedBlkRes = await api.get('/api/v1/etf-sector/', { timeout: ETF_SECTOR_TIMEOUT })
								this.data = storedBlkRes.data
							}
						const storedTrend = (this.data && this.data.etf_trend) ? this.data.etf_trend : null
						let resolvedTrend = this.resolveTrendPayload(
							trendRes.status === 'fulfilled' ? trendRes.value.data : null,
							storedTrend,
							trendParams.source === 'live'
						)
						if (!resolvedTrend && trendParams.source !== 'live') {
							try {
								const liveRes = await api.get('/api/v1/etf-sector/trend', { params: { ...trendParams, source: 'live' }, timeout: ETF_SECTOR_TIMEOUT })
								resolvedTrend = liveRes && liveRes.data ? liveRes.data : null
							} catch (_) {}
						}
						this.trendData = resolvedTrend
						this.health = healthRes.status === 'fulfilled' ? healthRes.value.data : null
						this.trendHistory = historyRes.status === 'fulfilled' && historyRes.value && historyRes.value.data && Array.isArray(historyRes.value.data.items)
							? historyRes.value.data.items
							: []
					} catch (e) {
						this.emitToast({ title: '刷新失败', message: e && e.message ? e.message : String(e) })
					} finally {
						this.loading = false
					}
				},
				async fetchTrendBacktest() {
					this.loadingBacktest = true
					try {
						const params = {
							codes: (this.trendControls.codes || '').trim() || undefined,
							top_n: this.normalizeTrendNumber(this.trendBacktestControls.top_n, 1),
							rebalance_days: this.normalizeTrendNumber(this.trendBacktestControls.rebalance_days, 20),
							lookback_short: this.normalizeTrendNumber(this.trendControls.lookback_short, this.trendDefaults.lookback_short),
							lookback_mid: this.normalizeTrendNumber(this.trendControls.lookback_mid, this.trendDefaults.lookback_mid),
							trade_cost_pct: Number.isFinite(Number(this.trendBacktestControls.trade_cost_pct)) ? Number(this.trendBacktestControls.trade_cost_pct) : 0.1,
						}
						const res = await api.get('/api/v1/backtest/etf-trend', { params })
						this.trendBacktest = res.data
						this.$nextTick(() => this.renderTrendBacktestChart())
					} catch (e) {
						this.trendBacktest = null
						this.emitToast({ title: 'ETF回测失败', message: e && e.message ? e.message : String(e) })
					} finally {
						this.loadingBacktest = false
					}
				},
				doTrendExport() {
					exportData('etf_trend', this.exportFormat, this.emitToast)
				}
			}
		}

								<div class="mt-3 grid grid-cols-2 gap-3">
									<div class="kpi"><div class="v">{{ fmtRatio(bucket.hit_rate) }}</div><div class="l">命中率</div></div>
									<div class="kpi"><div class="v">{{ fmtSigned(bucket.avg_excess_return_pct, 2) }}</div><div class="l">平均超额</div></div>
								</div>
								<div class="mt-3 text-xs" style="color: var(--muted)">{{ bucket.note }}</div>
								<div class="mt-2 text-xs" style="color: var(--muted)">已复盘 {{ bucket.review_count || 0 }} 个窗口，待复盘 {{ bucket.pending_count || 0 }} 个</div>
							</div>
						</div>
					</div>

					<div class="md:col-span-12 panel p-6">
						<div class="text-sm font-semibold">最近复盘记录</div>
						<div class="mt-4 overflow-x-auto">
							<table class="table">
								<thead>
									<tr>
										<th>日期</th>
										<th>对象 / 判断</th>
										<th>信号说明</th>
										<th>核心依据</th>
										<th>T+5</th>
										<th>T+20</th>
									</tr>
								</thead>
								<tbody>
									<tr v-for="item in reviewItems" :key="item.prediction_id">
										<td class="mono">{{ item.report_date }}</td>
										<td>
											<div class="font-semibold">{{ item.entity_name }}</div>
											<div class="mt-1 flex flex-wrap gap-2 items-center">
												<span class="badge">{{ item.label_cn }}</span>
												<span class="badge" :class="confidenceBadge(item.confidence_bucket)">{{ item.confidence_bucket_label }}</span>
											</div>
											<div class="text-xs mt-2" style="color: var(--muted)">{{ item.human_summary }}</div>
										</td>
										<td class="text-sm" style="max-width: 260px">
											<div>{{ item.signal_direction_cn }} / {{ fmtRatio(item.confidence) }}</div>
											<div class="text-xs mt-1" style="color: var(--muted)">{{ item.related_etf_summary === '-' ? item.confidence_note : '关联ETF：' + item.related_etf_summary }}</div>
										</td>
										<td class="text-sm" style="max-width: 320px">
											<div>{{ item.reason_summary }}</div>
											<div class="text-xs mt-1" style="color: var(--muted)">{{ formatReasons(item.reasons) }}</div>
										</td>
										<td>
											<div v-if="item.outcome5"><span class="badge" :class="reviewBadge(item.outcome5.status)">{{ item.outcome5.status_cn }}</span></div>
											<div class="text-xs mt-1" style="color: var(--muted)">{{ item.outcome5 ? item.outcome5.review_sentence : '-' }}</div>
											<div v-if="formatErrorTags(item.outcome5)" class="text-xs mt-1" style="color: var(--muted)">标签：{{ formatErrorTags(item.outcome5) }}</div>
										</td>
										<td>
											<div v-if="item.outcome20"><span class="badge" :class="reviewBadge(item.outcome20.status)">{{ item.outcome20.status_cn }}</span></div>
											<div class="text-xs mt-1" style="color: var(--muted)">{{ item.outcome20 ? item.outcome20.review_sentence : '-' }}</div>
											<div v-if="formatErrorTags(item.outcome20)" class="text-xs mt-1" style="color: var(--muted)">标签：{{ formatErrorTags(item.outcome20) }}</div>
										</td>
									</tr>
									<tr v-if="!reviewItems.length"><td colspan="6" style="color: var(--muted)">暂无复盘记录</td></tr>
								</tbody>
							</table>
						</div>
					</div>
				</section>
			`,
			data() {
				return {
					loading: false,
					data: { summary: {}, monthly_stats: {}, confidence_stats: {}, weekly_summary: {}, items: [] },
				}
			},
			computed: {
				reviewSummary() { return this.data && this.data.summary ? this.data.summary : {} },
				monthlyStats() { return this.data && this.data.monthly_stats ? this.data.monthly_stats : {} },
				confidenceStats() { return this.data && this.data.confidence_stats ? this.data.confidence_stats : {} },
				weeklySummary() { return this.data && this.data.weekly_summary ? this.data.weekly_summary : {} },
				monthlyCards() {
					return Array.isArray(this.monthlyStats.cards) ? this.monthlyStats.cards.slice(0, 3) : []
				},
				confidenceBuckets() {
					return Array.isArray(this.confidenceStats.buckets) ? this.confidenceStats.buckets : []
				},
				weeklyBullets() {
					const items = Array.isArray(this.weeklySummary.bullets) ? this.weeklySummary.bullets : []
					return items.length ? items : ['暂无周度摘要']
				},
				weeklyPeriod() {
					const start = this.weeklySummary.period_start
					const end = this.weeklySummary.period_end
					if (!start || !end) return '最近 7 天'
					return `${this.formatDateLabel(start)} - ${this.formatDateLabel(end)}`
				},
				reviewItems() {
					const items = Array.isArray(this.data && this.data.items) ? this.data.items : []
					return items.slice(0, 30).map(item => ({
						...item,
						outcome5: (item.outcomes || []).find(x => x.horizon === 5),
						outcome20: (item.outcomes || []).find(x => x.horizon === 20),
					}))
				},
			},
			mounted() { this.fetchData() },
			watch: { refreshKey() { this.fetchData() } },
			methods: {
				emitToast(payload) { this.$emit('toast', payload) },
				formatDateLabel(v) {
					const text = String(v || '')
					if (text.length === 8) return `${text.slice(0, 4)}-${text.slice(4, 6)}-${text.slice(6, 8)}`
					return text || '-'
				},
				fmtRatio(v) {
					const n = Number(v)
					return Number.isFinite(n) ? (n * 100).toFixed(1) + '%' : '-'
				},
				fmtSigned(v, digits = 2) {
					const n = Number(v)
					if (!Number.isFinite(n)) return '-'
					return (n > 0 ? '+' : '') + n.toFixed(digits) + '%'
				},
				formatReasons(items) {
					return Array.isArray(items) && items.length ? items.slice(0, 3).join('；') : '暂无说明'
				},
				formatErrorTags(item) {
					const tags = Array.isArray(item && item.error_tags) ? item.error_tags : []
					return tags.map(tag => tag && tag.label).filter(Boolean).join('、')
				},
				confidenceBadge(bucket) {
					if (bucket === 'high') return 'badge-strong'
					if (bucket === 'low') return 'badge-weak'
					return 'badge-warn'
				},
				reviewBadge(status) {
					if (status === 'hit' || status === 'weak_hit') return 'badge-strong'
					if (status === 'miss') return 'badge-weak'
					if (status === 'pending') return 'badge-warn'
					if (status === 'neutral') return 'badge-warn'
					return ''
				},
				async fetchData() {
					this.loading = true
					try {
						const res = await api.get('/api/v1/review/etf-sector', { params: { limit_reports: 40 }, timeout: ETF_SECTOR_TIMEOUT })
						this.data = res.data || { summary: {}, monthly_stats: {}, confidence_stats: {}, weekly_summary: {}, items: [] }
					} catch (e) {
						this.emitToast({ title: '复盘加载失败', message: e && e.message ? e.message : String(e) })
					} finally {
						this.loading = false
					}
				},
			},
		}

		const app = Vue.createApp({
			components: {
				'pair-trading': PairTrading,
				'multi-factor': MultiFactor,
				'ml-prediction': MLPrediction,
				'etf-sector': EtfSector,
				'review-module': ReviewModule,
				'daily-recommendation': DailyRecommendation,
			},
			data() {
				return {
					currentTab: 'daily_recommend',
					showSecondaryTabs: false,
					refreshKey: 0,
					updating: false,
						tabs: [
						{ id: 'daily_recommend', short: '00', name: '每日推荐' },
						{ id: 'pair_trading', short: '01', name: '配对交易' },
						{ id: 'multi_factor', short: '02', name: '多因子' },
						{ id: 'ml_prediction', short: '03', name: 'ML预测' },
						{ id: 'etf_sector', short: '04', name: 'ETF&板块' },
						{ id: 'review', short: '05', name: '复盘' },
					],
					toast: { show: false, title: '', message: '' },
				}
			},
			computed: {
				primaryTabs() {
					return (this.tabs || []).filter(tab => tab.id === 'daily_recommend' || tab.id === 'etf_sector' || tab.id === 'review')
				},
				secondaryTabs() {
					return (this.tabs || []).filter(tab => tab.id !== 'daily_recommend' && tab.id !== 'etf_sector' && tab.id !== 'review')
				},
			},
			methods: {
				showToast(payload) {
					this.toast.title = payload.title || '提示'
					this.toast.message = payload.message || ''
					this.toast.show = true
					window.clearTimeout(this._toastTimer)
					this._toastTimer = window.setTimeout(() => { this.toast.show = false }, 3500)
				},
				async forceUpdate() {
				if (this.updating) return
				this.updating = true
				try {
					this.showToast({ title: '更新中', message: '正在强制更新最新报告（可能需要几十秒）...' })
					const res = await api.post('/api/v1/report/refresh', null, { params: { mode: 'live', force: true } })
					const genAt = res && res.data ? (res.data.generated_at || '') : ''
					this.refreshKey += 1
					this.showToast({ title: '更新完成', message: genAt ? `已生成最新报告：${genAt}` : '已生成最新报告' })
				} catch (e) {
					const status = e && e.response ? e.response.status : null
					const detail = e && e.response && e.response.data ? e.response.data.detail : ''
					if (status === 409) {
						this.showToast({ title: '更新进行中', message: '后台正在生成报告（可能是你刚点过，或系统正在每小时自动更新）。我会自动等待完成...' })
						await this._waitForRefreshDone()
						return
					}
					if (detail.includes('empty_report') || detail.includes('network failure')) {
						this.showToast({ title: '网络连接失败', message: '无法获取实时数据。旧数据已保留。您可以点击“模拟数据”按钮使用演示数据。' })
						return
					}
					this.showToast({ title: '更新失败', message: detail || (e && e.message ? e.message : String(e)) })
				} finally {
					this.updating = false
				}
			},
			async forceUpdateMock() {
				if (this.updating) return
				this.updating = true
				try {
					this.showToast({ title: '更新中', message: '正在生成模拟数据...' })
					const res = await api.post('/api/v1/report/refresh', null, { params: { mode: 'mock', force: true } })
					const genAt = res && res.data ? (res.data.generated_at || '') : ''
					this.refreshKey += 1
					this.showToast({ title: '模拟数据已生成', message: genAt ? `报告时间：${genAt}` : '模拟数据已生成' })
				} catch (e) {
					const status = e && e.response ? e.response.status : null
					if (status === 409) {
						this.showToast({ title: '更新进行中', message: '后台正在生成报告，请稍后...' })
						return
					}
					this.showToast({ title: '生成失败', message: e && e.message ? e.message : String(e) })
				} finally {
					this.updating = false
				}
				},
				async _waitForRefreshDone() {
					const maxTries = 25
					for (let i = 0; i < maxTries; i++) {
						try {
							await new Promise(r => setTimeout(r, 3000))
							const res = await api.get('/api/v1/report/refresh/status')
							const st = res && res.data ? (res.data.status || {}) : {}
							if (!st.in_progress) {
								this.refreshKey += 1
								this.showToast({ title: '更新完成', message: st.last_success_at ? `已生成最新报告：${st.last_success_at}` : '已生成最新报告' })
								return
							}
						} catch (e) {
							// ignore transient errors during polling
						}
					}
				this.showToast({ title: '仍在更新中', message: '后台更新耗时较长，请稍后再点“强制更新”，或直接刷新页面查看更新时间。' })
			},
			async resetRefreshState() {
				if (this.updating) return
				this.updating = true
				try {
					const res = await api.post('/api/v1/report/refresh/reset')
					const wasStuck = res && res.data ? res.data.was_stuck : false
					if (wasStuck) {
						this.showToast({ title: '状态已重置', message: '之前有卡住的刷新任务，现在已清除。您可以重新尝试更新。' })
					} else {
						this.showToast({ title: '状态正常', message: '没有卡住的任务。' })
					}
				} catch (e) {
					this.showToast({ title: '重置失败', message: e && e.message ? e.message : String(e) })
			} finally {
				this.updating = false
			}
			}
		}
		})

		app.mount('#app')
	</script>
</body>
</html>
